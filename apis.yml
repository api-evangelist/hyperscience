aid: hyperscience
url: https://raw.githubusercontent.com/api-evangelist/hyperscience/refs/heads/main/apis.yml
name: Hyperscience
kind: company
description: >-
  Hyperscience provides enterprise-grade intelligent document processing (IDP)
  via the Hypercell platform. Capabilities include automated extraction,
  classification, GenAI processing, human-in-the-loop validation, and
  industry/use-case specific products (Hypercell for Freight Pay, GenAI,
  SNAP). Hyperscience exposes a REST API and a Flows SDK to its customers.
  FedRAMP High authorised; deployed in cloud and on-premises configurations.
