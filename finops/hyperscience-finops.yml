description: >-
  FOCUS-aligned FinOps profile for Hyperscience. Hyperscience is enterprise-
  only with custom annual contracts; cost surfaces are (a) the Hypercell
  platform license, (b) optional industry-specific modules (Freight Pay,
  GenAI, SNAP), and (c) for on-premises deployments, the customer's own
  infrastructure spend.
notes: >-
  No public unit pricing. FedRAMP High authorisation makes Hyperscience an
  unusually common pick for U.S. federal agencies; multi-year ELAs are
  typical. Cost allocation by document type / business unit is best done at
  the Flow / queue level inside Hypercell.
sources:
- https://www.hyperscience.ai/
- https://www.hyperscience.ai/security/
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Hyperscience
serviceCategory: Enterprise IDP
billingModel:
  pricingCategory: Enterprise Subscription
  billingFrequency: Annual / Multi-year ELA
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Hyperscience Hypercell
  ServiceCategory: AI / IDP
  ProviderName: Hyperscience
  PublisherName: Hyperscience
  InvoiceIssuerName: Hyperscience
  BillingCurrency: USD
  ChargeCategory: Purchase
  PricingUnit: contract-year
meters:
- name: hypercell_license
  description: Annual Hypercell platform license.
  unit: contract-year
  aggregation: sum
  dimensions:
  - account
- name: module_addon
  description: Per-module add-on (Freight Pay, GenAI, SNAP).
  unit: contract-year
  aggregation: sum
  dimensions:
  - account
  - module
- name: documents_processed
  description: Documents processed against contract throughput envelope.
  unit: document
  aggregation: sum
  dimensions:
  - tenant
  - flow
- name: pages_processed
  description: Pages processed (informational).
  unit: page
  aggregation: sum
  dimensions:
  - tenant
  - flow
- name: on_prem_infra
  description: Customer cloud / hardware spend for on-prem Hypercell deployments (cloud-billed).
  unit: vm-hour
  aggregation: sum
  dimensions:
  - cloud_account
  - region
principles:
- name: Visibility
  description: Use Hypercell admin telemetry per Flow; reconcile with annual invoice.
- name: Allocation
  description: One Flow per business unit / document type; map to FOCUS ResourceTag.
- name: Optimization
  description: Tune extraction thresholds to reduce review touches; consolidate Flows; renegotiate at renewal based on actual volume.
- name: Accountability
  description: Assign Flow owners; review monthly throughput against contract envelope.
maintainers:
