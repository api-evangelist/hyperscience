  is custom per contract, sized by document/page volume, modules deployed
  (Hypercell core, Freight Pay, GenAI, SNAP), deployment model (cloud SaaS or
  on-premises) and target accuracy SLA. FedRAMP High authorised for public-
  sector engagements.
notes: >-
